syntax = "proto3";
package n3mapping;

message LocalizationAtlasPreparedLevel {
    double resolution = 1;
    uint64 num_points = 2;
    // Format v2: xyz / normal xyz / row-major 3x3 covariance, all doubles.
    // Homogeneous point w=1, normal w=0 and covariance padding=0 are implicit.
    repeated double points = 3 [packed = true];
    repeated double normals = 4 [packed = true];
    repeated double covariances = 5 [packed = true];
    // v3: omit matrices only for the fixed normal-derived covariance model.
    bool covariance_from_normal = 6;
}

message LocalizationAtlasData {
    string format_version = 1;
    string map_sha256 = 2;
    string config_sha256 = 3;
    uint64 keyframe_count = 4;
    uint64 global_point_count = 5;
    repeated float global_points = 6 [packed = true];
    repeated LocalizationAtlasPreparedLevel plane_levels = 7;
    bool refine_level_present = 8;
    LocalizationAtlasPreparedLevel refine_level = 9;
    string frame_descriptor_config = 10;
    repeated LocalizationAtlasFrameDescriptor frame_descriptors = 11;
    string place_catalog_config = 12;
    repeated LocalizationAtlasPlace places = 13;
    string free_space_config = 14;
    LocalizationAtlasFreeSpaceGrid free_space_grid = 15;
    string loop_descriptor_config = 16;
    repeated LocalizationAtlasLoopDescriptor loop_descriptors = 17;
}

message LocalizationAtlasFreeSpaceGrid {
    double resolution = 1;
    repeated double origin = 2 [packed = true];
    repeated uint32 dimensions = 3 [packed = true];
    // One bit per cell, x-major then y then z; lowest bit first in each byte.
    bytes occupied = 4;
    bytes free = 5;
}

message LocalizationAtlasPlace {
    repeated int64 view_ids = 1 [packed = true];
}

message LocalizationAtlasCells {
    repeated uint32 indices = 1 [packed = true];
    repeated double values = 2 [packed = true];
}

message LocalizationAtlasFrameDescriptor {
    int64 keyframe_id = 1;
    repeated LocalizationAtlasCells planes = 2;
    LocalizationAtlasCells ring_height = 3;
    repeated double auxiliary = 4 [packed = true];
}

// Causal-submap place and single-frame heading, bound to this map and config.
message LocalizationAtlasLoopDescriptor {
    LocalizationAtlasFrameDescriptor submap = 1;
    repeated uint32 heading_offsets = 2 [packed = true];
    repeated uint32 heading_rings = 3 [packed = true];
    repeated double heading_values = 4 [packed = true];
}
